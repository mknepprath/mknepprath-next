name: Update Books

on:
  schedule:
    # Run daily at 7:30 AM UTC (2:30 AM ET), an hour after Update Themes and
    # half an hour after Update Trophies, so no two jobs race to push to master.
    - cron: "30 7 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-books
  cancel-in-progress: false

jobs:
  update-books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Warn rather than fail while the secret is missing: nothing here can set
      # it, and a red run every morning says no more than one warning does.
      - name: Record newly read books
        env:
          GOODREADS_ID: ${{ secrets.GOODREADS_ID }}
        run: |
          if [ -z "$GOODREADS_ID" ]; then
            echo "::warning title=GOODREADS_ID missing::Set it with \`gh secret set GOODREADS_ID\` (the numeric id from your Goodreads profile URL) to track read dates."
            exit 0
          fi
          npx tsx scripts/update-books.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/books.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate books.json
        if: steps.changes.outputs.changed == 'true'
        run: node -e "JSON.parse(require('fs').readFileSync('data/books.json', 'utf8'))"

      - name: Commit and push to master
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git commit --no-verify -m "Update books (automated)"
          git pull --rebase origin master
          git push origin master
